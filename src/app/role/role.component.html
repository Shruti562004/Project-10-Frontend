<div class="container py-5" style="margin-top:150px;">


    <div class="row justify-content-center">

        <div class="col-lg-7 col-md-9 col-sm-11">

            <div class="card shadow-lg border-0 rounded-4">

                <!-- Header -->
                <div class="card-header text-center text-white py-4"
                    style="background:linear-gradient(90deg,#2952CC,#1DA1F2);">

                    <h2 class="fw-bold mb-1">
                        <i class="bi bi-person-badge"></i>

                        <span *ngIf="!form.data.id">Add Role</span>
                        <span *ngIf="form.data.id>0">Update Role</span>

                    </h2>

                    <small>Enter role details</small>

                </div>

                <!-- Body -->

                <div class="card-body p-4">

                    <!-- Message -->

                    <div *ngIf="!form.error && form.message"
                        class="alert alert-success">

                        {{form.message}}

                    </div>

                    <div *ngIf="form.error && form.message"
                        class="alert alert-danger">

                        {{form.message}}

                    </div>

                    <!-- Name -->

                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Name <span class="text-danger">*</span>
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            name="name"
                            [(ngModel)]="form.data.name"
                            placeholder="Enter Role Name">

                        <small class="text-danger">
                            {{form.inputerror.name}}
                        </small>

                    </div>

                    <!-- Description -->

                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Description
                            <span class="text-danger">*</span>
                        </label>

                        <textarea
                            class="form-control"
                            rows="4"
                            name="description"
                            [(ngModel)]="form.data.description"
                            placeholder="Enter Short Description">
                        </textarea>

                        <small class="text-danger">
                            {{form.inputerror.description}}
                        </small>

                    </div>

                    <hr>

                     <!-- Buttons -->

<div class="row">

  <!-- ADD MODE -->
  <ng-container *ngIf="!form.data.id">

    <div class="col-6">
      <button class="btn btn-primary w-100 rounded-3"
              (click)="submit()">
        Save
      </button>
    </div>

    <div class="col-6">
      <button class="btn btn-outline-secondary w-100 rounded-3"
              (click)="reset()">
        Reset
      </button>
    </div>

  </ng-container>

  <!-- EDIT MODE -->
  <ng-container *ngIf="form.data.id">

    <div class="col-6">
      <button class="btn btn-success w-100 rounded-3"
              (click)="submit()">
        Update
      </button>
    </div>

    <div class="col-6">
        <button type="button" (click)="forward('/roleList')" class="btn btn-outline-secondary  w-100 rounded-3">
                    <i class="bi bi-list-ul me-1"></i>
                    List
                </button>
    </div>

  </ng-container>

</div>
                </div>

            </div>

        </div>

    </div>

</div>
