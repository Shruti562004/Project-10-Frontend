<div class="container d-flex justify-content-center py-4" style="margin-top:130px;">
    <div class="card shadow border-0 overflow-hidden w-100" style="max-width:1000px;border-radius:12px;">

        <!-- Header -->
        <div class="bg-primary text-white text-center py-4">
            <h3 class="fw-bold mb-1">
                Vehicle List
            </h3>
            <p class="mb-0 opacity-75 small">
                Search and manage Vehicle commands
            </p>
        </div>

        <div class="card-body p-4">

            <!-- Success -->
            <div *ngIf="!form.error && form.message"
                class="alert alert-success">
                {{form.message}}
            </div>

            <!-- Error -->
            <div *ngIf="form.error && form.message"
                class="alert alert-danger">
                {{form.message}}
            </div>

            <!-- Search -->
            <div class="row g-3 align-items-end mb-4  d-flex justify-content-center">

                <div class="col-md-5 ">
                    <label class="form-label fw-semibold">
                       Number
                    </label>

                    <input class="form-control"
                        placeholder="Enter Number"
                        [(ngModel)]="form.searchParams.number">
                </div>

                <div class="col-auto">
                    <button class="btn btn-primary"
                        (click)="search()">
                        Search
                    </button>
                </div>

                <div class="col-auto">
                    <button class="btn btn-outline-secondary"
                        (click)="reset()">
                        Reset
                    </button>
                </div>

            </div>

            <!-- Table -->
            <div class="table-responsive">

                <table class="table table-bordered table-hover align-middle text-center">

                    <thead class="table-primary">

                        <tr>

                            <th width="50">
                                <input type="checkbox"
                                    [(ngModel)]="isMasterSel"
                                    (change)="checkUncheckAll($event)">
                            </th>

                            <th>S.No</th>
                            <th>Number</th>
                            <th>Type</th>
                            <th>Model</th>
                            <th>Edit</th>

                        </tr>

                    </thead>

                    <tbody>

                        <tr *ngFor="let m of form.list; let i=index">

                            <td>
                                <input type="checkbox"
                                    #checkboxes
                                    [id]="m.id"
                                    [value]="isMasterSel"
                                    (change)="checklistUpdate()">
                            </td>

                            <td>{{(form.pageNo*5)+i+1}}</td>

                            <td>{{m.number}}</td>

                            <td>{{m.type}}</td>

                            <td>{{m.model}}</td>

                            <td>
                                <button class="btn btn-warning btn-sm"
                                    (click)="forward('/vehicle/'+m.id)">
                                    Edit
                                </button>
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

            <!-- Bottom Buttons -->
            <div class="row mt-4">

                <div class="col-md-3 mb-2">
                    <button class="btn btn-outline-secondary w-100"
                        (click)="previous()"
                        [disabled]="form.pageNo==0">
                        Previous
                    </button>
                </div>

                <div class="col-md-3 mb-2">
                    <button class="btn btn-success w-100"
                        (click)="forward('/vehicle')">
                        New
                    </button>
                </div>

                <div class="col-md-3 mb-2">
                    <button class="btn btn-danger w-100"
                        (click)="deleteMany()">
                        Delete
                    </button>
                </div>

                <div class="col-md-3 mb-2">
                    <button class="btn btn-outline-primary w-100"
                        (click)="next()"
                        [disabled]="form.nextListSize==0">
                        Next
                    </button>
                </div>

            </div>

            <!-- Back -->
            <div class="text-center mt-3" *ngIf="form.list.length==0">

                <button class="btn btn-secondary"
                    (click)="reset()">
                    Back
                </button>

            </div>

        </div>

    </div>

</div>
