<div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">

  <div class="card shadow border-0 overflow-hidden" style="width: 100%; max-width: 800px; border-radius: 12px;">

    <div class="bg-primary text-white text-center py-4">
      <h3 class="mb-1 fw-bold">
        <span *ngIf="!form.data.id">Add Voice</span>
        <span *ngIf="form.data.id > 0">Update Voice</span>
      </h3>
      <p class="mb-0 opacity-75 small">Enter voice details</p>
    </div>

   <div class="card-body p-4 bg-white">
  <!-- Message -->
<div *ngIf="!form.error && form.message"
     class="alert alert-success alert-dismissible fade show position-relative">

    {{ form.message }}

    <button type="button"
            class="close"
            (click)="form.message = ''"
            style="position:absolute; right:15px; top:8px; border:none; background:transparent; font-size:24px;">
        &times;
    </button>

</div>

<div *ngIf="form.error && form.message"
     class="alert alert-danger alert-dismissible fade show position-relative">

    {{ form.message }}

    <button type="button"
            class="close"
            (click)="form.message = ''"
            style="position:absolute; right:15px; top:8px; border:none; background:transparent; font-size:24px;">
        &times;
    </button>

</div>

      <div class="row g-3">
        
        <div class="col-md-6">
          <label class="form-label small fw-semibold text-secondary mb-1">
            Command Name <span class="text-danger">*</span>
          </label>
          <input class="form-control py-2 shadow-sm"
                 type="text"
                 name="commandName"
                 [(ngModel)]="form.data.commandName"
                 placeholder="Enter commandName"
                 style="font-size: 0.9rem;">
          <small class="text-danger d-block mt-1">{{form.inputerror.commandName}}</small>
        </div>

        <div class="col-md-6">
          <label class="form-label small fw-semibold text-secondary mb-1">
            Response <span class="text-danger">*</span>
          </label>
          <input class="form-control py-2 shadow-sm"
                 type="text"
                 name="response"
                 [(ngModel)]="form.data.response"
                 placeholder="Enter response"
                 style="font-size: 0.9rem;">
          <small class="text-danger d-block mt-1">{{form.inputerror.response}}</small>
        </div>

        <div class="col-md-6">
          <label class="form-label small fw-semibold text-secondary mb-1">
            Language <span class="text-danger">*</span>
          </label>
          <input class="form-control py-2 shadow-sm"
                 type="text"
                 name="language"
                 [(ngModel)]="form.data.language"
                 placeholder="Enter language"
                 style="font-size: 0.9rem;">
          <small class="text-danger d-block mt-1">{{form.inputerror.language}}</small>
        </div>

      </div>

      <hr class="text-muted my-4">

       <!-- Buttons -->

<div class="row">

  <!-- ADD MODE -->
  <ng-container *ngIf="!form.data.id">

    <div class="col-6">
      <button class="btn btn-primary w-100 rounded-3"
              (click)="submit()">
        Save
      </button>
    </div>

    <div class="col-6">
      <button class="btn btn-outline-secondary w-100 rounded-3"
              (click)="reset()">
        Reset
      </button>
    </div>

  </ng-container>

  <!-- EDIT MODE -->
  <ng-container *ngIf="form.data.id">

    <div class="col-6">
      <button class="btn btn-success w-100 rounded-3"
              (click)="submit()">
        Update
      </button>
    </div>

    <div class="col-6">
        <button type="button" (click)="forward('/voiceList')" class="btn btn-outline-secondary  w-100 rounded-3">
                    <i class="bi bi-list-ul me-1"></i>
                    List
                </button>
    </div>

  </ng-container>


              

            </div>

        </div>

    </div>

</div>
