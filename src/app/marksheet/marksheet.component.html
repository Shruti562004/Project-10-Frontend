<div class="container py-5" style="margin-top:150px;">

    <div class="row justify-content-center">

        <div class="col-lg-8 col-md-10 col-12">

            <div class="card shadow-lg border-0 rounded-4">

                <!-- Header -->
                <div class="card-header text-center text-white py-4"
                    style="background:linear-gradient(90deg,#2952CC,#1DA1F2);">

                    <h2 class="fw-bold mb-1">
                        <i class="bi bi-journal-text"></i>

                        <span *ngIf="!form.data.id">Add Marksheet</span>
                        <span *ngIf="form.data.id>0">Update Marksheet</span>

                    </h2>

                    <small>Enter marksheet details</small>

                </div>

                <!-- Body -->
                <div class="card-body p-4">

                    <!-- Success Message -->
                    <div *ngIf="!form.error && form.message"
                        class="alert alert-success">
                        {{form.message}}
                    </div>

                    <!-- Error Message -->
                    <div *ngIf="form.error && form.message"
                        class="alert alert-danger">
                        {{form.message}}
                    </div>

                    <div class="row">

                        <!-- Roll No -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">
                                Roll No <span class="text-danger">*</span>
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="rollNo"
                                [(ngModel)]="form.data.rollNo"
                                maxlength="5"
                                placeholder="Enter Roll No">

                            <small class="text-danger">
                                {{form.inputerror.rollNo}}
                            </small>
                        </div>

                        <!-- Student -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">
                                Student <span class="text-danger">*</span>
                            </label>

                            <select
                                class="form-select"
                                name="studentId"
                                [(ngModel)]="form.data.studentId">

                                <option value="undefined">
                                    ------------Select------------
                                </option>

                                <option
                                    *ngFor="let obj of form.preload.studentList"
                                    [value]="obj.key">

                                    {{obj.value}}

                                </option>

                            </select>

                            <small class="text-danger">
                                {{form.inputerror.studentId}}
                            </small>
                        </div>

                        <!-- Physics -->
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-semibold">
                                Physics <span class="text-danger">*</span>
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="physics"
                                [(ngModel)]="form.data.physics"
                                maxlength="3"
                                placeholder="Physics Marks">

                            <small class="text-danger">
                                {{form.inputerror.physics}}
                            </small>
                        </div>

                        <!-- Chemistry -->
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-semibold">
                                Chemistry <span class="text-danger">*</span>
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="chemistry"
                                [(ngModel)]="form.data.chemistry"
                                maxlength="3"
                                placeholder="Chemistry Marks">

                            <small class="text-danger">
                                {{form.inputerror.chemistry}}
                            </small>
                        </div>

                        <!-- Maths -->
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-semibold">
                                Maths <span class="text-danger">*</span>
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="maths"
                                [(ngModel)]="form.data.maths"
                                maxlength="3"
                                placeholder="Maths Marks">

                            <small class="text-danger">
                                {{form.inputerror.maths}}
                            </small>
                        </div>

                    </div>

                    <hr>

                       <!-- Buttons -->

<div class="row">

  <!-- ADD MODE -->
  <ng-container *ngIf="!form.data.id">

    <div class="col-6">
      <button class="btn btn-primary w-100 rounded-3"
              (click)="submit()">
        Save
      </button>
    </div>

    <div class="col-6">
      <button class="btn btn-outline-secondary w-100 rounded-3"
              (click)="reset()">
        Reset
      </button>
    </div>

  </ng-container>

  <!-- EDIT MODE -->
  <ng-container *ngIf="form.data.id">

    <div class="col-6">
      <button class="btn btn-success w-100 rounded-3"
              (click)="submit()">
        Update
      </button>
    </div>

    <div class="col-6">
        <button type="button" (click)="forward('/marksheetList')" class="btn btn-outline-secondary  w-100 rounded-3">
                    <i class="bi bi-list-ul me-1"></i>
                    List
                </button>
    </div>

  </ng-container>

</div>
                </div>

            </div>

        </div>

    </div>

</div>
