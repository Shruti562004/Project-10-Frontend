<div class="container py-5" style="margin-top:120px;">

    <div class="row justify-content-center">

        <div class="col-lg-9 col-md-10 col-sm-11">

            <div class="card shadow-lg border-0 rounded-4">

                <!-- Header -->
                <div class="card-header text-center text-white py-4"
                    style="background:linear-gradient(90deg,#2952CC,#1DA1F2);">

                    <h2 class="fw-bold mb-1">
                        <i class="bi bi-mortarboard-fill"></i>

                        <span *ngIf="!form.data.id">Add Student</span>
                        <span *ngIf="form.data.id>0">Update Student</span>

                    </h2>

                    <small>Enter student details</small>

                </div>

                <!-- Body -->
                <div class="card-body p-4">

                    <!-- Message -->

                    <div *ngIf="!form.error && form.message"
                        class="alert alert-success">
                        {{form.message}}
                    </div>

                    <div *ngIf="form.error && form.message"
                        class="alert alert-danger">
                        {{form.message}}
                    </div>

                    <div class="row">

                        <!-- Enrol No -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">
                                Enrol No <span class="text-danger">*</span>
                            </label>

                            <input type="text"
                                class="form-control"
                                name="enrolNo"
                                [(ngModel)]="form.data.enrolNo"
                                placeholder="Enter Enrol No">

                            <small class="text-danger">
                                {{form.inputerror.enrolNo}}
                            </small>
                        </div>

                        <!-- First Name -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">
                                First Name <span class="text-danger">*</span>
                            </label>

                            <input type="text"
                                class="form-control"
                                name="firstName"
                                [(ngModel)]="form.data.firstName"
                                placeholder="Enter First Name">

                            <small class="text-danger">
                                {{form.inputerror.firstName}}
                            </small>
                        </div>

                        <!-- Last Name -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">
                                Last Name <span class="text-danger">*</span>
                            </label>

                            <input type="text"
                                class="form-control"
                                name="lastName"
                                [(ngModel)]="form.data.lastName"
                                placeholder="Enter Last Name">

                            <small class="text-danger">
                                {{form.inputerror.lastName}}
                            </small>
                        </div>

                        <!-- Email -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">
                                Email ID <span class="text-danger">*</span>
                            </label>

                            <input type="text"
                                class="form-control"
                                name="email"
                                [(ngModel)]="form.data.email"
                                placeholder="Enter Email ID">

                            <small class="text-danger">
                                {{form.inputerror.email}}
                            </small>
                        </div>

                        <!-- DOB -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">
                                Date of Birth <span class="text-danger">*</span>
                            </label>

                            <input type="date"
                                class="form-control"
                                name="dob"
                                [(ngModel)]="form.data.dob"
                                [ngModel]="form.data.dob | date:'yyyy-MM-dd'">

                            <small class="text-danger">
                                {{form.inputerror.dob}}
                            </small>
                        </div>

                        <!-- College -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">
                                College <span class="text-danger">*</span>
                            </label>

                            <select class="form-select"
                                name="collegeId"
                                [(ngModel)]="form.data.collegeId">

                                <option value="undefined">
                                    ------------Select------------
                                </option>

                                <option
                                    *ngFor="let obj of form.preload.collegeList"
                                    [value]="obj.key">

                                    {{obj.value}}

                                </option>

                            </select>

                            <small class="text-danger">
                                {{form.inputerror.collegeId}}
                            </small>
                        </div>

                        <!-- Mobile -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">
                                Mobile No <span class="text-danger">*</span>
                            </label>

                            <input type="text"
                                class="form-control"
                                maxlength="10"
                                name="phoneNo"
                                [(ngModel)]="form.data.phoneNo"
                                placeholder="Enter Mobile No">

                            <small class="text-danger">
                                {{form.inputerror.phoneNo}}
                            </small>
                        </div>

                    </div>

                    <hr>
   <!-- Buttons -->

<div class="row">

  <!-- ADD MODE -->
  <ng-container *ngIf="!form.data.id">

    <div class="col-6">
      <button class="btn btn-primary w-100 rounded-3"
              (click)="submit()">
        Save
      </button>
    </div>

    <div class="col-6">
      <button class="btn btn-outline-secondary w-100 rounded-3"
              (click)="reset()">
        Reset
      </button>
    </div>

  </ng-container>

  <!-- EDIT MODE -->
  <ng-container *ngIf="form.data.id">

    <div class="col-6">
      <button class="btn btn-success w-100 rounded-3"
              (click)="submit()">
        Update
      </button>
    </div>

    <div class="col-6">
        <button type="button" (click)="forward('/studentList')" class="btn btn-outline-secondary  w-100 rounded-3">
                    <i class="bi bi-list-ul me-1"></i>
                    List
                </button>
    </div>

  </ng-container>

</div>
                </div>

            </div>

        </div>

    </div>

</div>
