<div class="container d-flex justify-content-center align-items-center"
     style="min-height: 85vh;">

    <div class="card shadow-lg border-0 p-4 w-100"
         style="max-width:500px; border-radius:15px;">

        <!-- Heading -->
        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary">Forget Password</h2>
        </div>

        <!-- Success/Error Message -->
        <div style="min-height:30px;">
            <div class="alert alert-success text-center py-2"
                 *ngIf="!form.error && form.message">
                {{ form.message }}
            </div>

            <div class="alert alert-danger text-center py-2"
                 *ngIf="form.error && form.message">
                {{ form.message }}
            </div>
        </div>

        <!-- Login ID -->
        <div class="mb-3">
            <label class="form-label fw-bold">
                Login ID <span class="text-danger">*</span>
            </label>

            <div class="input-group">
                <input
                    type="text"
                    class="form-control"
                    name="loginId"
                    [(ngModel)]="form.data.loginId"
                    placeholder="Enter Login ID">

                <button
                    class="btn btn-primary px-4"
                    (click)="submit()">
                    Go
                </button>
            </div>

            <small class="text-danger">
                {{ form.inputerror.loginId }}
            </small>
        </div>

    </div>
</div>
