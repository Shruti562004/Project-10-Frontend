<div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">

  <div class="card shadow border-0 overflow-hidden" style="width: 100%; max-width: 800px; border-radius: 12px;">

    <div class="bg-primary text-white text-center py-4 position-relative">
      <h3 class="mb-1 fw-bold">
        <i class="bi bi-box-seam me-2"></i> <span *ngIf="!form.data.id">Add Courier</span>
        <span *ngIf="form.data.id > 0">Update Courier</span>
      </h3>
      <p class="mb-0 opacity-75 small">Enter courier details</p>
    </div>

    <div class="card-body p-4 bg-white">

     <!-- Success Message -->
                    <div *ngIf="!form.error && form.message"
                        class="alert alert-success">
                        {{form.message}}
                    </div>

                    <!-- Error Message -->
                    <div *ngIf="form.error && form.message"
                        class="alert alert-danger">
                        {{form.message}}
                    </div>

      <div class="row g-3">
        
        <div class="col-md-6">
          <label class="form-label small fw-semibold text-secondary mb-1">Sender Name <span class="text-danger">*</span></label>
          <input class="form-control py-2 shadow-sm"
                 type="text"
                 [(ngModel)]="form.data.senderName"
                 placeholder="Enter sender name"
                 style="font-size: 0.9rem;">
          <small class="text-danger d-block mt-1">{{form.inputerror.senderName}}</small>
        </div>

        <div class="col-md-6">
          <label class="form-label small fw-semibold text-secondary mb-1">Receiver Name <span class="text-danger">*</span></label>
          <input class="form-control py-2 shadow-sm"
                 type="text"
                 [(ngModel)]="form.data.receiverName"
                 placeholder="Enter receiver name"
                 style="font-size: 0.9rem;">
          <small class="text-danger d-block mt-1">{{form.inputerror.receiverName}}</small>
        </div>

        <div class="col-md-6">
          <label class="form-label small fw-semibold text-secondary mb-1">Tracking Number <span class="text-danger">*</span></label>
          <input class="form-control py-2 shadow-sm"
                 type="text"
                 [(ngModel)]="form.data.trackingNumber"
                 placeholder="Enter tracking number"
                 style="font-size: 0.9rem;">
          <small class="text-danger d-block mt-1">{{form.inputerror.trackingNumber}}</small>
        </div>

        <div class="col-md-6">
          <label class="form-label small fw-semibold text-secondary mb-1">Delivery Status <span class="text-danger">*</span></label>
          <input class="form-control py-2 shadow-sm"
                 type="text"
                 [(ngModel)]="form.data.deliveryStatus"
                 placeholder="Enter delivery status"
                 style="font-size: 0.9rem;">
          <small class="text-danger d-block mt-1">{{form.inputerror.deliveryStatus}}</small>
        </div>

      </div>

      <hr>

                      
   <!-- Buttons -->

<div class="row">

  <!-- ADD MODE -->
  <ng-container *ngIf="!form.data.id">

    <div class="col-6">
      <button class="btn btn-primary w-100 rounded-3"
              (click)="submit()">
        Save
      </button>
    </div>
<div class="col-6">

                            <button
                                class="btn btn-outline-secondary w-100 rounded-3"
                                (click)="reset()">

                                Reset

                            </button>

                        </div>

  </ng-container>

<!-- EDIT MODE -->
  <ng-container *ngIf="form.data.id">

      <div class="col-6">
      <button class="btn btn-success w-100 rounded-3"
              (click)="submit()">
        Update
      </button>
    </div>

    <div class="col-6">
        <button type="button" (click)="forward('/courierList')" class="btn btn-outline-secondary  w-100 rounded-3">
                    <i class="bi bi-list-ul me-1"></i>
                    List
                </button>
    </div>

  </ng-container>

                        
      </div>

    </div>
  </div>
</div>
