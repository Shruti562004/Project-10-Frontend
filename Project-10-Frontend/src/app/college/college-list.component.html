

<div class="container py-4" style="margin-top: 130px;">

  <!-- Title -->
  <div class="text-center mb-4">
    <h1 class="fw-bold text-primary">College List</h1>
  </div>

  <!-- Message -->
  <div class="text-center mb-3">
    <h5 class="text-success" *ngIf="!form.error && form.message">{{ form.message }}</h5>
    <h5 class="text-danger" *ngIf="form.error && form.message">{{ form.message }}</h5>
  </div>

  <!-- List -->
  <div *ngIf="form.list.length > 0" class="table-responsive">

    <!-- Search Box -->
    <div class="row mb-3 justify-content-center">
      <div class="col-md-6 col-sm-10 d-flex gap-2">
        <input type="text"
               class="form-control"
               [(ngModel)]="form.searchParams.name"
               placeholder="Enter College Name">

        <button class="btn btn-primary" (click)="search()">Search</button>
        <button class="btn btn-secondary" (click)="reset()">Reset</button>
      </div>
    </div>

    <!-- Table -->
    <table class="table table-bordered table-hover text-center align-middle">
      <thead class="table-primary">
        <tr>
          <th>
            <input type="checkbox"
                   [(ngModel)]="isMasterSel"
                   (change)="checkUncheckAll($event)">
          </th>
          <th>S.No</th>
          <th>Name</th>
          <th>Address</th>
          <th>State</th>
          <th>City</th>
          <th>Phone</th>
          <th>Edit</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let m of form.list; let i = index">
          <td>
            <input type="checkbox"
                   #checkboxes
                   (change)="checklistUpdate()"
                   [id]="m.id"
                   [value]="isMasterSel">
          </td>

          <td>{{ (form.pageNo * 5) + i + 1 }}</td>
          <td>{{ m.name }}</td>
          <td>{{ m.address }}</td>
          <td>{{ m.state }}</td>
          <td>{{ m.city }}</td>
          <td>{{ m.phoneNo }}</td>

          <td>
            <a class="btn btn-sm btn-warning"
               (click)="forward('/college/' + m.id)">
              Edit
            </a>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- Pagination / Actions -->
    <div class="row mt-3 text-center">

      <div class="col-6 col-md-3 mb-2">
        <button class="btn btn-outline-secondary w-100"
                (click)="previous()"
                [disabled]="form.pageNo == 0">
          Previous
        </button>
      </div>

      <div class="col-6 col-md-3 mb-2">
        <button class="btn btn-success w-100"
                (click)="forward('/college')">
          New
        </button>
      </div>

      <div class="col-6 col-md-3 mb-2">
        <button class="btn btn-danger w-100"
                (click)="deleteMany()">
          Delete
        </button>
      </div>

      <div class="col-6 col-md-3 mb-2">
        <button class="btn btn-outline-primary w-100"
                (click)="next()"
                [disabled]="form.nextListSize == 0">
          Next
        </button>
      </div>

    </div>

  </div>

  <!-- Empty State -->
  <div *ngIf="form.list.length == 0" class="text-center mt-4">
    <button class="btn btn-secondary" (click)="reset()">Back</button>
  </div>

</div>

<app-footer></app-footer>
