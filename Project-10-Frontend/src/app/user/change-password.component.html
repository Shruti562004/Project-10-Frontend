<div class="container d-flex justify-content-center py-5" style="margin-top:150px;">

    <div class="card shadow-lg border-0 w-100" style="max-width:550px; border-radius:15px;">

        <!-- Header -->
        <div class="card-header text-center text-white py-3"
            style="background:linear-gradient(135deg,#0d6efd,#0a58ca);">

            <h3 class="fw-bold mb-0">
                <i class="bi bi-key-fill me-2"></i>
                Change Password
            </h3>

        </div>

        <!-- Body -->
        <div class="card-body p-4">

          <!-- Message -->
<div *ngIf="!form.error && form.message"
     class="alert alert-success alert-dismissible fade show position-relative">

    {{ form.message }}

    <button type="button"
            class="close"
            (click)="form.message = ''"
            style="position:absolute; right:15px; top:8px; border:none; background:transparent; font-size:24px;">
        &times;
    </button>

</div>

<div *ngIf="form.error && form.message"
     class="alert alert-danger alert-dismissible fade show position-relative">

    {{ form.message }}

    <button type="button"
            class="close"
            (click)="form.message = ''"
            style="position:absolute; right:15px; top:8px; border:none; background:transparent; font-size:24px;">
        &times;
    </button>

</div>

            <!-- Old Password -->
            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Old Password <span class="text-danger">*</span>
                </label>

                <input
                    type="password"
                    class="form-control"
                    name="oldPassword"
                    [(ngModel)]="form.data.oldPassword"
                    placeholder="Enter Old Password">

                <small class="text-danger">
                    {{form.inputerror.oldPassword}}
                </small>

            </div>

            <!-- New Password -->
            <div class="mb-4">

                <label class="form-label fw-semibold">
                    New Password <span class="text-danger">*</span>
                </label>

                <input
                    type="password"
                    class="form-control"
                    name="newPassword"
                    [(ngModel)]="form.data.newPassword"
                    placeholder="Enter New Password">

                <small class="text-danger">
                    {{form.inputerror.newPassword}}
                </small>

            </div>

            <!-- Button -->
            <div class="d-grid">

                <button
                    class="btn btn-primary btn-lg rounded-pill"
                    (click)="changePassword()">

                    <i class="bi bi-shield-lock-fill me-2"></i>
                    Change Password

                </button>

            </div>

        </div>

    </div>

</div>
