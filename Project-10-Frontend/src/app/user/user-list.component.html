
<div class="container py-4" style="margin-top: 130px;">

    <!-- Heading -->
    <div class="text-center mb-4">
        <h1 class="fw-bold text-primary">User List</h1>
    </div>

    <!-- Messages -->
    <div class="text-center mb-3" style="min-height:30px;">
        <h5 class="text-success" *ngIf="!form.error && form.message">
            {{form.message}}
        </h5>

        <h5 class="text-danger" *ngIf="form.error && form.message">
            {{form.message}}
        </h5>
    </div>

    <!-- Search Panel -->
       <div *ngIf="form.list.length > 0" class="table-responsive">
    <div class="row justify-content-center mb-4 g-2">

        <div class="col-lg-3 col-md-6">
            <input class="form-control"
                   placeholder="Enter First Name"
                   [(ngModel)]="form.searchParams.firstName">
        </div>

        <div class="col-lg-3 col-md-6">
            <input class="form-control"
                   placeholder="Enter Login Id"
                   [(ngModel)]="form.searchParams.loginId">
        </div>

        <div class="col-lg-2 col-md-6">
            <select class="form-select"
                    [(ngModel)]="form.searchParams.roleId">

                <option value="undefined">Select Role</option>

                <option *ngFor="let obj of form.preload.roleList"
                        [value]="obj.key">
                    {{obj.value}}
                </option>

            </select>
        </div>

        <div class="col-auto">
            <button class="btn btn-primary"
                    (click)="search()">
                Search
            </button>
        </div>

        <div class="col-auto">
            <button class="btn btn-secondary"
                    (click)="reset()">
                Reset
            </button>
        </div>

    </div>

    <!-- Table -->
    <div class="table-responsive shadow-sm rounded">

        <table class="table table-bordered table-hover align-middle text-center mb-0">

            <thead class="table-primary">

                <tr>

                    <th width="50">
                        <input type="checkbox"
                               [(ngModel)]="isMasterSel"
                               (change)="checkUncheckAll($event)">
                    </th>

                    <th>S.No</th>
                     <th>Image</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Login Id</th>
                    <th>Date of Birth</th>
                    <th>Gender</th>
                    <th>Role</th>
                    <th>Mobile</th>
                    <th>Status</th>
                    <th>Edit</th>

                </tr>

            </thead>

            <tbody>

                <tr *ngFor="let m of form.list; let i=index">

                    <td>
                        <input type="checkbox"
                               #checkboxes
                               [id]="m.id"
                               [value]="isMasterSel"
                               (change)="checklistUpdate()">
                    </td>

                    <td>{{(form.pageNo*5)+i+1}}</td>
               <td>   <img *ngIf="m.imageId" [src]="'http://localhost:8080/User/profilePic/' + m.id"
                                class="img-thumbnail" style="width: 1.5cm; height: 1.5cm; object-fit: cover;">
</td>
                    <td>{{m.firstName}}</td>
                    <td>{{m.lastName}}</td>
                    <td>{{m.loginId}}</td>
                    <td>{{m.dob | date:'dd-MM-yyyy'}}</td>
                    <td>{{m.gender}}</td>
                    <td>{{m.roleName}}</td>
                    <td>{{m.phone}}</td>
                    <td>{{m.status}}</td>

                    <td>
                        <button class="btn btn-warning btn-sm"
                                (click)="forward('/user/' + m.id)">
                            Edit
                        </button>
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

    <!-- Bottom Buttons -->
    <div class="row mt-4 g-3">

        <div class="col-lg-3 col-md-6">
            <button class="btn btn-outline-secondary w-100"
                    (click)="previous()"
                    [disabled]="form.pageNo==0">
                Previous
            </button>
        </div>

        <div class="col-lg-3 col-md-6">
            <button class="btn btn-success w-100"
                    (click)="forward('/user')">
                New
            </button>
        </div>

        <div class="col-lg-3 col-md-6">
            <button class="btn btn-danger w-100"
                    (click)="deleteMany()">
                Delete
            </button>
        </div>

        <div class="col-lg-3 col-md-6">
            <button class="btn btn-outline-primary w-100"
                    (click)="next()"
                    [disabled]="form.nextListSize==0">
                Next
            </button>
        </div>

    </div>

</div>
<!-- Empty State -->
  <div *ngIf="form.list.length == 0" class="text-center mt-4">
    <button class="btn btn-secondary" (click)="reset()">Back</button>
  </div>
