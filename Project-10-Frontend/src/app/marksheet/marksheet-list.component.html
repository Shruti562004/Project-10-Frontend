
<div class="container py-4" style="margin-top: 130px;">

    <!-- Heading -->
    <div class="text-center mb-4">
        <h1 class="fw-bold text-primary">Marksheet List</h1>
    </div>

      <!-- Message -->
<div *ngIf="!form.error && form.message"
     class="alert alert-success alert-dismissible fade show position-relative">

    {{ form.message }}

    <button type="button"
            class="close"
            (click)="form.message = ''"
            style="position:absolute; right:15px; top:8px; border:none; background:transparent; font-size:24px;">
        &times;
    </button>

</div>

<div *ngIf="form.error && form.message"
     class="alert alert-danger alert-dismissible fade show position-relative">

    {{ form.message }}

    <button type="button"
            class="close"
            (click)="form.message = ''"
            style="position:absolute; right:15px; top:8px; border:none; background:transparent; font-size:24px;">
        &times;
    </button>

</div>

    <!-- Search Section -->
    <div class="row justify-content-center align-items-center g-2 mb-4">

        <div class="col-lg-4 col-md-6">
            <input type="text"
                   class="form-control"
                   placeholder="Enter Student Name"
                   [(ngModel)]="form.searchParams.name">
        </div>

        <div class="col-auto">
            <button class="btn btn-primary"
                    (click)="search()">
                Search
            </button>
        </div>

        <div class="col-auto">
            <button class="btn btn-secondary"
                    (click)="reset()">
                Reset
            </button>
        </div>

    </div>

    <!-- Table -->
    <div class="table-responsive shadow-sm rounded"
         *ngIf="form.list.length>0">

        <table class="table table-bordered table-hover align-middle text-center mb-0">

            <thead class="table-primary">
                <tr>

                    <th width="50">
                        <input type="checkbox"
                               [(ngModel)]="isMasterSel"
                               (change)="checkUncheckAll($event)">
                    </th>

                    <th>S.No</th>
                    <th>Roll No</th>
                    <th>Name</th>
                    <th>Physics</th>
                    <th>Chemistry</th>
                    <th>Maths</th>
                    <th>Edit</th>

                </tr>
            </thead>

            <tbody>

                <tr *ngFor="let m of form.list; let i=index">

                    <td>
                        <input type="checkbox"
                               #checkboxes
                               [id]="m.id"
                               [value]="isMasterSel"
                               (change)="checklistUpdate()">
                    </td>

                    <td>{{(form.pageNo*5)+i+1}}</td>
                    <td>{{m.rollNo}}</td>
                    <td>{{m.name}}</td>
                    <td>{{m.physics}}</td>
                    <td>{{m.chemistry}}</td>
                    <td>{{m.maths}}</td>

                    <td>
                        <button class="btn btn-warning btn-sm"
                                (click)="forward('/marksheet/' + m.id)">
                            Edit
                        </button>
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

    <!-- Bottom Buttons -->
    <div class="row mt-4 g-3" *ngIf="form.list.length>0">

        <div class="col-lg-3 col-md-6">
            <button class="btn btn-outline-secondary w-100"
                    (click)="previous()"
                    [disabled]="form.pageNo==0">
                Previous
            </button>
        </div>

        <div class="col-lg-3 col-md-6">
            <button class="btn btn-success w-100"
                    (click)="forward('/marksheet')">
                New
            </button>
        </div>

        <div class="col-lg-3 col-md-6">
            <button class="btn btn-danger w-100"
                    (click)="deleteMany()">
                Delete
            </button>
        </div>

        <div class="col-lg-3 col-md-6">
            <button class="btn btn-outline-primary w-100"
                    (click)="next()"
                    [disabled]="form.nextListSize==0">
                Next
            </button>
        </div>

    </div>

    <!-- Back Button -->
    <div class="text-center mt-4" *ngIf="form.list.length==0">
        <button class="btn btn-secondary"
                (click)="reset()">
            Back
        </button>
    </div>

</div>
